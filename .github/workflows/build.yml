name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      short_sha: ${{ steps.version.outputs.short_sha }}
      head_sha: ${{ steps.version.outputs.head_sha }}
      file_name: ${{ steps.version.outputs.file_name }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Test
        run: ./gradlew testDebugUnitTest

      - name: Lint
        # Lint the variant that ships: minification and resource shrinking can
        # only surface problems on release.
        run: ./gradlew lintRelease

      - name: Materialize keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        # Fail loudly instead of publishing an unsigned APK, which Android
        # would refuse to install over an existing build.
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 is not available to this repository. Authorize the org secret under RULES/KEYSTORE.md."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"

      - name: Assemble signed release APK
        env:
          KEYSTORE_STORE_FILE: ${{ runner.temp }}/keystore.jks
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
        run: |
          ./gradlew assembleRelease

      - name: Verify the APK is signed
        # An unsigned build is allowed to succeed locally, so assert here that CI
        # did not silently produce one.
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::$apk was not produced, so the release build is unsigned."
            exit 1
          fi
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)"
          # The exit status is the assertion: verify fails on an unsigned or
          # otherwise unverifiable APK. Certificates are printed for the record
          # only; their wording varies between build-tools revisions.
          "$apksigner" verify --print-certs "$apk"

      - name: Stamp the artifact
        id: version
        # Read the stamp out of the built APK instead of recomputing it so the
        # release metadata always matches what was signed. CI does not bump the
        # local packaging counter, so the pack segment is the committed count.
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"

          badging="$("$aapt2" dump badging "$apk")"
          version_name="$(sed -n "s/.* versionName='\([^']*\)'.*/\1/p" <<< "$badging")"
          version_code="$(sed -n "s/.* versionCode='\([^']*\)'.*/\1/p" <<< "$badging")"
          short_sha="$(git rev-parse --short=8 HEAD)"
          # Full sha separately: actions/checkout only treats a ref as a commit
          # when it is all 40 hex characters.
          head_sha="$(git rev-parse HEAD)"

          if [ -z "$version_name" ] || [ -z "$version_code" ]; then
            echo "::error::could not read a version out of the built APK"
            exit 1
          fi

          file_name="netdis-${version_name}-build${GITHUB_RUN_NUMBER}-${short_sha}.apk"
          mkdir -p dist
          cp "$apk" "dist/$file_name"

          {
            echo "version_name=$version_name"
            echo "version_code=$version_code"
            echo "short_sha=$short_sha"
            echo "head_sha=$head_sha"
            echo "file_name=$file_name"
          } >> "$GITHUB_OUTPUT"

          echo "Built $file_name (versionCode $version_code)"

      - uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: dist/*.apk
          if-no-files-found: error

  pre-release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v8
        with:
          name: app-release
          path: apk

      - name: Publish rolling pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: canary
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
          SHORT_SHA: ${{ needs.build.outputs.short_sha }}
          FILE_NAME: ${{ needs.build.outputs.file_name }}
          FULL_SHA: ${{ needs.build.outputs.head_sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          mapfile -t built < <(find apk -maxdepth 1 -name '*.apk')
          if [ "${#built[@]}" -ne 1 ]; then
            echo "::error::expected exactly one APK under apk/, found ${#built[@]}"
            exit 1
          fi
          artifact="${built[0]}"
          subject="$(git log -1 --pretty=%s)"
          notes="$(printf 'Build #%s, version `%s` (versionCode `%s`), commit `%s`.\n\n%s\n\nSigned canary APK. Install it over the previous build; the in-app updater checks the SHA-256 and Android verifies the signature.\n\nManifest: `canary.properties`' \
            "$RUN_NUMBER" "$VERSION_NAME" "$VERSION_CODE" "$SHORT_SHA" "$subject")"

          # The in-app updater reads this manifest to learn the run number and
          # expected digest. It is tiny, so the app fetches it from GitHub
          # directly and only proxies the APK itself.
          size="$(stat -c%s "$artifact")"
          digest="$(sha256sum "$artifact" | cut -d' ' -f1)"
          printf '%s\n' \
            '# Generated by the Build workflow. Consumed by the in-app updater.' \
            'runNumber='"$RUN_NUMBER" \
            'versionName='"$VERSION_NAME" \
            'sizeBytes='"$size" \
            'sha256='"$digest" \
            'assetName='"$FILE_NAME" \
            'commit='"$FULL_SHA" \
            > apk/canary.properties

          # Recreate the rolling tag at the exact commit that produced this APK.
          # Deleting first also drops the previous run's differently-named APK,
          # so the release never lists two installable files.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$artifact" apk/canary.properties \
            --title "NetDis $VERSION_NAME canary" \
            --notes "$notes" \
            --prerelease \
            --target "$FULL_SHA"
